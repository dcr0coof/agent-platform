# Agent Platform

# LLM 配置
llm:
  api_key: ""           # 通过环境变量 AGENT_LLM_API_KEY 设置
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.7

# Agent 配置
agent:
  max_iterations: 10
  name: "default"

# 记忆配置
memory:
  max_messages: 20
  enable_summary: true
  summary_trigger: 30

# 天气 API 配置
weather:
  api_key: ""           # 通过环境变量 AGENT_WEATHER_API_KEY 设置
