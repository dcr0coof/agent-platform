# Agent Platform

# LLM 配置
llm:
  api_key: ""           # 通过环境变量 AGENT_LLM_API_KEY 设置
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.7

# Agent 配置
agent:
  max_iterations: 10     # 工具调用最大轮次
  name: "default"

# 记忆配置
memory:
  max_messages: 20       # 滑动窗口大小
  enable_summary: true   # 长对话自动摘要
  summary_trigger: 30    # 超过此消息数触发摘要
